# The Neuman server is never updated by unattended-upgrades (D111).
#
# A release can carry a migration, migrations are forward-only (D103), and the
# only undo is a backup. That backup has to be taken by a *Neuman administrator
# account* — root is not an admin, by design — so no package hook can take one
# for the operator, and an appliance that migrates at 3am to a release with a
# bug needs a person, awake, holding an account. So the server moves when the
# person who owns it decides it moves, and the cost is stated in
# `docs/platforms.md`: Neuman's own fixes arrive when they install them.
#
# `^neuman$` is anchored because the value is a regex: a bare `neuman` would
# also match `neuman-client`.
Unattended-Upgrade::Package-Blacklist {
        "^neuman$";
};
