# The Neuman client may update itself; the server may not (D111).
#
# Only a new *client* is allowed here. The client has no schema and no database:
# its state is `session.json`, a UI token and the spill directory, and undoing a
# bad release is one `apt install` with nothing to restore. So unattended
# upgrades turn "the client is a release behind" into a fact nobody has to act
# on, which is the whole point — the appliance's administrator should never have
# to coordinate other people's machines.
#
# The server is blacklisted in its own package's file, for the opposite reason:
# a release can carry a migration, and migrations are forward-only (D103).
#
# The origin is `Origin: Neuman`, `Suite: stable`, which is what
# `deploy/ubuntu/repo.sh` writes and what the download page's keyring
# instructions name.
Unattended-Upgrade::Allowed-Origins {
        "Neuman:stable";
};
